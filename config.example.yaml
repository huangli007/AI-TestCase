# AI 测试用例生成 Agent 配置模板
# 复制为 config.yaml 使用;所有 ${ENV} 会自动从环境变量读取。

llm:
  base_url: ${LLM_BASE_URL:}               # 留空,由用户填写(如 https://api.deepseek.com/v1)
  api_key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:}                     # 留空,由用户填写(如 deepseek-chat)
  vision_model: ${LLM_VISION_MODEL:}        # 视觉模型,如 gpt-4o / qwen-vl-max / deepseek-vl
  temperature: 0.6
  max_retries: 3
  timeout: 120

pipeline:
  max_frames_per_video: 12                  # 视频最大抽帧数
  frame_interval: 2.0                       # 抽帧间隔(秒)
  max_image_size: 1280                      # 图片最长边(px)
  review_enabled: true                      # 是否启用质量评审阶段
  mock_mode: false                          # true 时走 Mock,无需 API Key
  max_cases: 150                             # 用例总数上限

export:
  formats: [xlsx, md, json]

prototype:
  figma_token: ${FIGMA_TOKEN:}        # 可选:读取 Figma 原型图链接截图(账户设置 → Security → Personal Access Token)
  mastergo_token: ${MASTERGO_TOKEN:}  # 可选:MasterGo 开放平台 Token(未配置时尝试浏览器截图)
